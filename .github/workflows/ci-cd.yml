name: CI/CD Pipeline

on:
  # Trigger on push to main or master branch
  push:
    branches: [ main, master ]
  # Trigger on pull request targeting main or master branch
  pull_request:
    branches: [ main, master ]
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # ==========================================================
  # JOB 1: Continuous Integration (Lint, Test, Build, Package)
  # ==========================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Clean install of dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run automated unit tests
      - name: Run automated tests
        run: npm test

      # Step 5: Execute production build
      - name: Build production application
        run: npm run build

      # Step 6: Preserve build artifact for download / inspection
      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-calculator-dist
          path: dist
          retention-days: 14

      # Step 7: Package build output for GitHub Pages
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ==========================================================
  # JOB 2: Continuous Deployment (Deploy to GitHub Pages)
  # ==========================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-test
    # Deploy only when changes are pushed to main or master branch (not on PRs)
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Step 8: Deploy static assets to GitHub Pages environment
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
